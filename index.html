<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TO DO</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  </head>
  <body>
    <h1>TO DO LIST</h1>
    <div class="deployment-info-container">
      <h2>New deployments</h2>
    </div>
    <p class="description">
      This frontend is returned from my to-do-list worker
    </p>

    <form>
      <input type="text" name="Body" placeholder="Enter your task" />
      <button hx-post="/api/tasks" hx-target="#to-do-list-list" hx-swap="beforeend">Submit</button>
    </form>

    <div id="to-do-list-container">
      <ul class="to-do-list-list" id="to-do-list-list" hx-get="/api/tasks" hx-trigger="load">
      </ul>
    </div>

    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
